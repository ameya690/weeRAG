[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wee"
version = "0.2.0"
description = "wee: LLM/RAG internals from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
retrieval = ["transformers", "sentence-transformers"]
bench = ["datasets", "sentence-transformers", "anthropic", "torch>=2.0.0"]
demo = ["gradio", "streamlit"]
dev = ["ruff", "pytest", "torch>=2.0.0"]

[tool.setuptools.packages.find]
include = ["wee*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"wee/__init__.py" = ["F401"]
"examples/*" = ["F401", "E731"]
