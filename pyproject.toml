[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wee"
version = "0.2.0-dev"
description = "wee: LLM/RAG internals from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy",
]

[project.optional-dependencies]
retrieval = ["transformers", "sentence-transformers"]
demo = ["gradio"]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
include = ["wee*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"wee/__init__.py" = ["F401"]
"examples/*" = ["F401", "E731"]
